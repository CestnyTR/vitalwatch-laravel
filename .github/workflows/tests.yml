# Testler — her push'ta desteklenen PHP ve Laravel sürümlerinde.
#
# Yayın burada YOK: Packagist GitHub'ı izliyor, `v*` etiketi gönderildiğinde
# yeni sürüm kendiliğinden görünür. Bu yüzden etiketten ÖNCE bu iş akışının
# yeşil olduğuna bakılmalı — Packagist testleri beklemez.
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        laravel: ["11", "12"]
        include:
          - laravel: "11"
            testbench: "^9.0"
          - laravel: "12"
            testbench: "^10.0"
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none
      - run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: ./vendor/bin/pest
