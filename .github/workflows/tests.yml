# Testler — her push'ta desteklenen PHP ve Laravel sürümlerinde.
#
# Yayın burada YOK: Packagist GitHub'ı izliyor ve `v*` etiketi göründüğü an
# yeni sürümü yayınlıyor — testleri beklemez. Bu yüzden etiket elle atılmaz;
# `release.yml` bu iş akışını çağırır ve etiketi ancak testler geçerse oluşturur.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        laravel: ["11", "12"]
        include:
          - laravel: "11"
            testbench: "^9.0"
          - laravel: "12"
            testbench: "^10.0"
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none
      # Laravel 11'in bütün sürümlerinde kapatılmamış güvenlik bildirimleri var
      # (güvenlik desteği bitti) ve Composer onları kurmayı reddediyor. Engel
      # yalnızca BU test ortamında kalkıyor: amaç paketin L11 ile hâlâ
      # çalıştığını görmek. Yayınlanan pakete ya da kuran projeye etkisi yok.
      #
      # Anahtar Composer sürümüne göre değişiyor: 2.9'da `audit.block-insecure`,
      # daha yenilerinde `policy.advisories.block`. Hangisi varsa o tutar.
      - if: matrix.laravel == '11'
        run: |
          composer config policy.advisories.block false 2>/dev/null \
            || composer config audit.block-insecure false
      - run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: ./vendor/bin/pest
